name: Build and Push Docker Image

# Fork (PietroCanovai/PostersPlus): builds the Studio image from the `studio`
# branch only, amd64 only (the server is x86_64), and bakes the commit into the
# image so Studio can show its version and spot updates.

on:
  push:
    branches:
      - studio
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
      - '.devcontainer/**'
      - 'discovery_overrides.example.json'
      - 'Showcase/**'
      - 'deploy/**'
  # Manual trigger from the Actions tab, e.g. to rebuild after a registry hiccup.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/pietrocanovai/postersplus
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
