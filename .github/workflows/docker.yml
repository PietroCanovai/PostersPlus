name: Build and Push Docker Image

# Fork (PietroCanovai/PostersPlus): builds the Studio image from the `studio`
# branch only, amd64 only (the server is x86_64), and bakes the commit into the
# image so Studio can show its version and spot updates.

on:
  push:
    branches:
      - studio
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
      - '.devcontainer/**'
      - 'discovery_overrides.example.json'
      - 'Showcase/**'
      - 'deploy/**'
  # Manual trigger from the Actions tab, e.g. to rebuild after a registry hiccup.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pietrocanovai/postersplus
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
